coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  - "src/**/index.ts"
  - "src/terminal/handover.ts"
  - "src/charts/register.ts"
  - "build.ts"
  - "manifest.ts"
  - "tsup.config.ts"
  - "**/*.test.ts"
  - "**/*.test.tsx"
